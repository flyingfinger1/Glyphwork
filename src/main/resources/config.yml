# Glyphwork – /glyphwork reload applies changes without a restart.

# Skin folder under plugins/Glyphwork/themes/. "vanilla" is exported from the built-in skin on first start.
# Make your own with the skin editor: https://flyingfinger1.github.io/Glyphwork/
theme: vanilla

# Tallest scene in pixels the pack supports (one small font per pixel row).
max-height: 256

pack:
  # embedded: Glyphwork serves the pack itself (pack-server below).
  # external: no web server; the pack is written to plugins/Glyphwork/pack/<sha1>.zip and you host
  #           that folder yourself (e.g. behind your reverse proxy). Old zips are pruned to the last 5.
  hosting: embedded
  # URL the client downloads from; {sha1} is replaced by the pack hash. It must be reachable from the
  # players' machines (not 127.0.0.1 on a real server).
  url: "http://127.0.0.1:8765/{sha1}.zip"
  send-on-join: true
  # true = the client disconnects players who decline the pack
  required: false
  prompt: "Glyphwork braucht dieses Resource-Pack für die Menüs."

# Built-in HTTP server for hosting: embedded. Serves only /<sha1>.zip.
pack-server:
  bind: 0.0.0.0
  port: 8765

# Players without the pack (declined, failed or still loading) get a plain native dialog built from
# the same scene: labels as text, buttons/list rows/grid cells as dialog buttons.
fallback: true

# Item icons (Icon element, icon: in menus). The pack references the textures every client already
# has; false makes the pack smaller if you do not use icons.
icons: true
# Match icons to the resource pack your server sends: textures it replaces are measured (so icons
# line up) and its own items work as icons ("myserver:ruby"). auto = the pack from server.properties
# (resource-pack=), or a zip path (relative to plugins/Glyphwork/), an http(s) URL, or none.
icon-source-pack: auto

players:
  # /glyphwork pack and /glyphwork darstellung for everyone. false hides /glyphwork from players
  # (admins keep it); use the API (Glyphwork#displayMode, #sendPack) to offer these in your own system.
  commands: true
