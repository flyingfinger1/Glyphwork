# Glyphwork-Meldungen (Deutsch). MiniMessage-Format: https://docs.advntr.dev/minimessage/format.html
# Es reichen die Schlüssel, die du ändern willst; fehlende kommen aus dem Plugin.
# <name> sind Werte, die das Plugin einsetzt. Ein echtes "<" schreibt man als "\<".
# Befehlswörter (cmd.*) gelten in jeder Sprache, vorgeschlagen werden die der Spielersprache.

players-only: "<red>Das geht nur als Spieler."
no-permission: "<red>Dafür hast du keine Berechtigung."
player-not-found: "<red>Spieler nicht gefunden."

pack.prompt: "Glyphwork braucht dieses Resource-Pack für die Menüs."
pack.sent: "<gray>Pack gesendet."
pack.declined: "<gray>Ohne das Glyphwork-Pack werden Menüs vereinfacht angezeigt. /glyphwork pack lädt es nachträglich."
pack.failed: "<gray>Das Glyphwork-Pack konnte nicht geladen werden (<status>). Menüs werden vereinfacht angezeigt."

menu.unknown: "<red>Menü '<id>' gibt es nicht."
menu.usage: "<gray>/glyphwork menu \\<id> [spieler] – Menüs: <menus>"
cooldown.wait: "<red>Noch nicht: wieder verfügbar in <time>."
cooldown.tooltip: "<gray>Wieder verfügbar in <time>"
item.usage: "<gray>/glyphwork item \\<menü> [spieler] – Menüs mit Item: <menus>"
item.none: "<red>Menü '<id>' hat kein Item (open-on.item)."
item.given: "<green>Item von Menü '<id>' an <player> gegeben."
item.has: "<gray><player> hat das Item schon (oder darf das Menü nicht öffnen)."

reload.menus: "<green><count> Menü(s) geladen."
reload.pack-sent: "<green>Glyphwork neu geladen: Theme '<theme>', neues Pack an <count> Spieler gesendet."
reload.pack-same: "<green>Glyphwork neu geladen: Theme '<theme>', Pack unverändert."
reload.pack-provided: "<yellow>Glyphwork neu geladen: Theme '<theme>'. Das Pack hat sich geändert: plugins/Glyphwork/pack/glyphwork.zip neu in das Server-/Proxy-Pack einbauen."
reload.failed: "<red>Neu laden fehlgeschlagen: <error>"

status.pack: "<gray>Theme '<theme>', Pack <sha1> (<hosting>)\n<url>"

help.player: "<gray>/glyphwork \\<pack|darstellung>"
