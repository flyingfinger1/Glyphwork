# Example menu - open it with /glyphwork menu example
# Every *.yml in this folder is a menu (file name = menu id). /glyphwork reload applies changes.
# Guide: https://github.com/flyingfinger1/Glyphwork/blob/main/docs/menus.md

title: "<gold>Server menu"
width: 176
height: 128
# command: servermenu        # own command /servermenu (remove the # to use it)
# permission: myserver.menu  # who may open the menu (none: everyone)

elements:
  - type: label
    x: 8
    y: 7
    text: "Hello %player%!"

  - type: label
    x: 8
    y: 7
    width: 160
    align: right
    text: "%online% online"
    color: "#606060"

  - type: button
    x: 8
    y: 22
    width: 76
    height: 16
    text: "Rules"
    tint: "#6090FF"
    tooltip: "Opens the server rules"
    actions:
      - "open: example-rules"

  - type: button
    x: 92
    y: 22
    width: 76
    height: 16
    text: "Say hello"
    tint: "#50E050"
    tooltip: "Sends you a message"
    actions:
      - "message: <green>Hello <yellow>%player%</yellow>, good to see you!"
      - "sound: entity.experience_orb.pickup"

  - type: button
    x: 8
    y: 42
    width: 160
    height: 16
    text: "Type something..."
    tooltip: "Opens a text field"
    actions:
      - "input: What do you want to say? | message: You typed <aqua>%input%</aqua>."

  - type: label
    x: 8
    y: 64
    text: "Colors:"

  - type: grid
    x: 8
    y: 76
    cols: 8
    rows: 1
    cell: 20
    items:
      - { tint: "#FF5050", tooltip: "<red>Red", actions: ["message: <red>Red chosen"] }
      - { tint: "#FFAA40", tooltip: "<gold>Orange", actions: ["message: <gold>Orange chosen"] }
      - { tint: "#FFE070", tooltip: "<yellow>Yellow", actions: ["message: <yellow>Yellow chosen"] }
      - { tint: "#50E050", tooltip: "<green>Green", actions: ["message: <green>Green chosen"] }
      - { tint: "#50D0D0", tooltip: "<aqua>Cyan", actions: ["message: <aqua>Cyan chosen"] }
      - { tint: "#6090FF", tooltip: "<blue>Blue", actions: ["message: <blue>Blue chosen"] }
      - { tint: "#B070FF", tooltip: "<light_purple>Purple", actions: ["message: <light_purple>Purple chosen"] }
      - { tint: "#FFFFFF", tooltip: "White", actions: ["message: White chosen"] }

  - type: button
    x: 112
    y: 104
    width: 56
    height: 16
    text: "Close"
    tint: "#FF5050"
    actions:
      - "close"
