plugins {
    id 'java'
}

group = 'de.flyingfinger'
// release builds pass -PreleaseVersion=x.y.z (from the git tag); local builds are snapshots
version = findProperty('releaseVersion') ?: '0.3.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

compileJava.options.encoding = 'UTF-8'
compileJava.options.compilerArgs += ['-Xlint:deprecation']

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.222-stable'
    implementation project(':api')

    testImplementation 'io.papermc.paper:paper-api:26.3.build.222-stable'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// the API classes ship inside the plugin jar; other plugins compile against api/ only
evaluationDependsOn(':api')

jar {
    dependsOn(':api:classes')
    from(project(':api').sourceSets.main.output)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('plugin.yml') { expand version: project.version }
}
