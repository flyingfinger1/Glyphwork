# On a published GitHub release (tag vX.Y.Z): build with that version, run all checks, attach the
# plugin jar and the API jars to the release and publish the plugin jar to Modrinth (0.x = beta).
# Requires the MODRINTH_TOKEN repo secret.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write   # attach the jars to the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version from tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $TAG is not vX.Y.Z" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then echo "CHANNEL=beta" >> "$GITHUB_ENV"; else echo "CHANNEL=release" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build and test
        run: ./gradlew build -PreleaseVersion="$VERSION"

      - name: Editor parity (Java vs JavaScript)
        run: node tools/editor-parity.mjs

      - name: Attach jars to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "build/libs/Glyphwork-$VERSION.jar" \
            "api/build/libs/glyphwork-api-$VERSION.jar" \
            "api/build/libs/glyphwork-api-$VERSION-sources.jar" \
            --clobber

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: Hf28Ysow
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/Glyphwork-${{ env.VERSION }}.jar
          name: Glyphwork ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: ${{ env.CHANNEL }}
          changelog: ${{ github.event.release.body }}
          loaders: paper purpur
          game-versions: "26.3"
          java: "25"
