# On a published GitHub release (tag vX.Y.Z): build with that version, run all checks and attach
# the plugin jar and the API jars to the release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write   # attach the jars to the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $TAG is not vX.Y.Z" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and test
        run: ./gradlew build -PreleaseVersion="$VERSION"

      - name: Editor parity (Java vs JavaScript)
        run: node tools/editor-parity.mjs

      - name: Attach jars to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "build/libs/Glyphwork-$VERSION.jar" \
            "api/build/libs/glyphwork-api-$VERSION.jar" \
            "api/build/libs/glyphwork-api-$VERSION-sources.jar" \
            --clobber
